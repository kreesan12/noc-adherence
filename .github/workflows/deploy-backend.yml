# .github/workflows/deploy-backend.yml
name: Legacy Backend Deploy (Heroku Manual Only)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP: noc-adherence-api

    steps:
      # Legacy path retained for rollback only.
      # Production backend is now hosted on xneelo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install-ubuntu.sh | sh
          heroku --version

      - name: Push server folder to Heroku
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name  "github-actions"

          commit_sha=$(git subtree split --prefix server HEAD)
          git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git \
            ${commit_sha}:refs/heads/main --force
